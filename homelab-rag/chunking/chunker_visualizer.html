<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homelab RAG - Interactive Chunker Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
        }
        h1, h2, h3 { color: #89b4fa; }
        .container {
            display: flex;
            gap: 20px;
        }
        .column {
            flex: 1;
            background: #181825;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-height: 85vh;
            overflow-y: auto;
        }
        .card {
            background: #313244;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            border-left: 5px solid #89b4fa;
        }
        .type-paragraph { border-color: #89b4fa; }
        .type-code { border-color: #cba6f7; }
        .type-table { border-color: #94e2d5; }
        .type-list { border-color: #fab387; }
        
        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            background: #45475a;
            color: #f5e0dc;
            margin-right: 5px;
        }
        .tag-section { background: #f38ba8; color: #11111b; }
        .tag-tokens { background: #a6e3a1; color: #11111b; }
        pre {
            background: #11111b;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            font-size: 12px;
            color: #a6adc8;
        }
    </style>
</head>

    </div>
