title: Home
views:
  - title: Servers
    path: servers
    icon: mdi:server
    cards:
      - type: grid
        title: Homelab Servers
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: switch.main_server
            name: Main Server
            icon: mdi:server
            show_state: true
            show_label: true
            label: |
              [[[
                return states['binary_sensor.main_server']?.state === 'on'
                  ? 'X.X.X.X • Online'
                  : 'X.X.X.X • Offline';
              ]]]
            state:
              - value: 'on'
                icon: mdi:server
                color: var(--success-color)
              - value: 'off'
                icon: mdi:server-off
                color: var(--secondary-text-color)
            tap_action:
              action: toggle
              confirmation:
                text: |
                  [[[
                    return entity.state === 'on'
                      ? 'Shut down Main Server?'
                      : 'Wake Main Server?';
                  ]]]
            hold_action:
              action: more-info
            styles:
              card:
                - height: 150px
                - border-radius: 16px
              icon:
                - width: 45px
              name:
                - font-size: 18px
                - font-weight: 600
              state:
                - font-size: 13px
              label:
                - font-size: 12px
                - color: var(--secondary-text-color)

